name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libs for OpenCV / Open3D
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install (CPU reference + pytest)
        run: pip install -e ".[dev,reference]"
      - name: CPU tests
        run: pytest tests/ -q --tb=short
        # GPU / nvdiffrast / GeDi / teaserpp skip via importorskip.
